<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ezel Inks</title>
    <style>
        /* Base page styling */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #ffffff; /* White background */
            overflow: hidden; /* Prevents scrollbars during zoom animation */
            font-family: sans-serif;
        }

        /* Black screen overlay for a smooth transition */
        #black-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            opacity: 0; /* Hidden by default */
            pointer-events: none; /* Lets clicks pass through to the button */
            z-index: 100; /* Stays on top of everything */
            transition: opacity 1.5s ease-in-out; /* Fades in smoothly */
        }

        /* Elements that will fade away when clicked */
        .fade-bg {
            transition: opacity 1s ease-in-out;
        }

        /* UPDATED: Watermark is now bigger and pushed down */
        .watermark {
            width: 375px; 
            margin-bottom: 15px; 
            margin-top: 65px; 
            z-index: 2;
        }

        /* Tiny stars scattered via absolute positioning */
        .tiny-star {
            position: absolute;
            width: 50px; 
            z-index: 1;
            /* Constant rotation animation */
            animation: spin 10s linear infinite;
        }

        /* The rotation logic for the small stars */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Small Star Placements */
        .star-1 { top: 15%; left: 15%; }
        .star-2 { top: 20%; right: 20%; }
        .star-3 { bottom: 30%; left: 20%; }
        .star-4 { bottom: 35%; right: 15%; }
        .star-5 { top: 38%; left: 8%; }
        .star-6 { top: 40%; right: 28%; }

        /* The interactive big star button */
        .enter-btn-container {
            position: relative;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Big star sizing */
        .big-star {
            width: 450px; 
            transition: transform 1.8s ease-in-out;
        }

        /* --- ANIMATION STATES (Triggered by JavaScript) --- */
        
        /* Fades out the background stars and watermark */
        body.animate-out .fade-bg {
            opacity: 0;
        }

        /* Rotates and scales up massively to fill screen */
        body.animate-out .big-star {
            transform: scale(60) rotate(180deg); 
        }

        /* Fades the whole screen to black so the text inside the star gets hidden smoothly */
        body.animate-out #black-overlay {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- The black overlay that fades in -->
    <div id="black-overlay"></div>

    <!-- Scattered Tiny Stars -->
    <img src="small-star.png" class="fade-bg tiny-star star-1" alt="">
    <img src="small-star.png" class="fade-bg tiny-star star-2" alt="">
    <img src="small-star.png" class="fade-bg tiny-star star-3" alt="">
    <img src="small-star.png" class="fade-bg tiny-star star-4" alt="">
    <img src="small-star.png" class="fade-bg tiny-star star-5" alt="">
    <img src="small-star.png" class="fade-bg tiny-star star-6" alt="">

    <!-- Main Watermark -->
    <img src="watermark.png" class="fade-bg watermark" alt="Ezel Inks">

    <!-- Big Star Button -->
    <div class="enter-btn-container" id="enterButton">
        <img src="big-star.png" class="big-star" alt="Enter Star">
    </div>

    <script>
        document.getElementById('enterButton').addEventListener('click', function() {
            // Adds the class to trigger the CSS animations
            document.body.classList.add('animate-out');
            
            // Waits 1.8 seconds (matching the animation length) then redirects
            setTimeout(function() {
                window.location.href = 'menu.html';
            }, 1800);
        });
    </script>
</body>
</html>
