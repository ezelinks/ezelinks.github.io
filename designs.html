<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Designs - Ezel Inks</title>
    <style>
        /* Base page styling */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: black;
            overflow-x: hidden; 
        }

        /* --- CORNER LOGO --- */
        .corner-logo {
            position: fixed;
            top: 25px;
            right: 40px;
            width: 150px;
            z-index: 1000;
        }

        /* --- HEADER SECTION --- */
        .header-section {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 60px;
            margin-bottom: 50px;
        }

        .title-img {
            width: 400px; 
            z-index: 10;
        }

        .book-btn {
            width: 250px; 
            margin-top: 15px;
            cursor: pointer;
            transition: transform 0.2s ease;
            z-index: 10;
        }

        .book-btn:hover {
            transform: scale(1.05);
        }

        /* Asymmetrical Rotating Stars */
        .header-star {
            position: absolute;
            width: 80px;
            animation: spin 12s linear infinite;
            filter: invert(1); 
            z-index: 1;
        }
        .header-star.left { top: -20px; left: 20%; }
        .header-star.right { top: 40px; right: 22%; width: 60px; } 

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- GALLERY LAYOUT --- */
        .gallery-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            max-width: 1200px;
            margin: 0 auto; 
            padding: 0 20px 100px 20px;
        }

        .category-column {
            flex: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            border-right: 1px solid black; 
        }

        .category-column:last-child {
            border-right: none;
        }

        .cat-title-img {
            width: 180px; 
            margin-bottom: 30px;
        }

        /* --- THE 2-COLUMN DESIGN GRIDS --- */
        .design-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            width: 100%;
        }

        .design-grid img {
            width: 100%; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: transform 0.2s ease;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.05); 
        }

        .design-grid img:hover {
            transform: scale(1.05); 
        }

        /* --- LIGHTBOX (Zoomed Image Pop-up) --- */
        #lightbox {
            display: none; 
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(255, 255, 255, 0.95); 
            z-index: 2000; 
            align-items: center;
            justify-content: center;
            flex-direction: column;
            /* Prevents weird highlighting when swiping */
            user-select: none; 
        }

        #lightbox.active {
            display: flex; 
        }

        #lightbox-img {
            max-width: 85vw;
            max-height: 85vh;
            object-fit: contain;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.15); 
            /* Prevents dragging the image itself on phone */
            pointer-events: none; 
        }

        /* Lightbox Controls (X and Arrows) */
        .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 50px;
            font-weight: 300;
            cursor: pointer;
            color: black;
            line-height: 1;
            z-index: 2001;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 50px;
            font-weight: 300;
            cursor: pointer;
            color: black;
            padding: 20px;
            z-index: 2001;
            transition: transform 0.2s ease;
        }

        .nav-btn:hover {
            transform: translateY(-50%) scale(1.2);
        }

        .prev-btn { left: 30px; }
        .next-btn { right: 30px; }

      /* --- RETURN TO MENU BUTTON --- */
        .return-menu-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 80px; 
            width: 100%;
        }

        .return-menu-btn {
            width: 250px; /* Adjust size based on your drawing */
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .return-menu-btn:hover {
            transform: scale(1.05);
        }
     /* --- MOBILE VIEW --- */
        @media (max-width: 768px) {
            /* Shrunk slightly more to 75px */
            .corner-logo { position: absolute; top: 15px; right: 15px; width: 75px; }
            
            /* FIXED: Pushed the entire title block WAY down so it sits below the logo */
            .header-section { margin-top: 120px; }
            
            .title-img { width: 280px; }
            .book-btn { width: 200px; }
            
            /* Stars adjusted to clear the title */
            .header-star.left { top: -20px; left: 2%; width: 50px; }
            .header-star.right { top: 60px; right: 2%; width: 45px; }
            
            .gallery-container { flex-direction: column; }
            .category-column {
                width: 100%;
                border-right: none; 
                border-bottom: 1px solid black; 
                padding-bottom: 40px;
                margin-bottom: 40px;
            }
            .category-column:last-child { border-bottom: none; }

            /* Adjust lightbox arrows for smaller screens */
            .nav-btn { font-size: 40px; padding: 10px; }
            .prev-btn { left: 5px; }
            .next-btn { right: 5px; }
            .close-btn { top: 20px; right: 25px; }
        }
    </style>
</head>
<body>

    <!-- Watermark (Goes back to Menu) -->
    <a href="menu.html">
        <img src="watermark.png" class="corner-logo" alt="Ezel Inks">
    </a>

    <!-- Header (Title, Button, Stars) -->
    <div class="header-section">
        <img src="star-designs.png" class="header-star left" alt="">
        
        <img src="title-designs.png" class="title-img" alt="Available Designs">
        
        <a href="https://instagram.com/ezel.inks" target="_blank">
            <img src="book-now.png" class="book-btn" alt="Book Now">
        </a>
        
        <img src="star-designs.png" class="header-star right" alt="">
    </div>
    
    <!-- Gallery Area -->
    <div class="gallery-container">
        
        <!-- CATEGORY 1: Illustrative -->
        <div class="category-column">
            <img src="cat-illustrative.png" class="cat-title-img" alt="Illustrative">
            <div class="design-grid">
                <img src="illus-1.png" class="tattoo-design" alt="Design">
                <img src="illus-2.png" class="tattoo-design" alt="Design">
                <img src="illus-3.png" class="tattoo-design" alt="Design">
                <img src="illus-4.png" class="tattoo-design" alt="Design">
                <img src="illus-5.png" class="tattoo-design" alt="Design">
                <img src="illus-6.png" class="tattoo-design" alt="Design">
                <img src="illus-7.png" class="tattoo-design" alt="Design">
            </div>
        </div>

        <!-- CATEGORY 2: Lino Print -->
        <div class="category-column">
            <img src="cat-lino.png" class="cat-title-img" alt="Lino Print">
            <div class="design-grid">
                <img src="lino-1.png" class="tattoo-design" alt="Design">
                <img src="lino-2.png" class="tattoo-design" alt="Design">
                <img src="lino-3.png" class="tattoo-design" alt="Design">
                <img src="lino-4.png" class="tattoo-design" alt="Design">
            </div>
        </div>

        <!-- CATEGORY 3: Tiny Tatts -->
        <div class="category-column">
            <img src="cat-tiny.png" class="cat-title-img" alt="Tiny Tatts">
            <div class="design-grid">
                <img src="tiny-1.png" class="tattoo-design" alt="Design">
                <img src="tiny-2.png" class="tattoo-design" alt="Design">
                <img src="tiny-3.png" class="tattoo-design" alt="Design">
                <img src="tiny-4.png" class="tattoo-design" alt="Design">
                <img src="tiny-5.png" class="tattoo-design" alt="Design">
                <img src="tiny-6.png" class="tattoo-design" alt="Design">
                <img src="tiny-7.png" class="tattoo-design" alt="Design">
                <img src="tiny-8.png" class="tattoo-design" alt="Design">
                <img src="tiny-9.png" class="tattoo-design" alt="Design">
                <img src="tiny-10.png" class="tattoo-design" alt="Design">
                <img src="tiny-11.png" class="tattoo-design" alt="Design">
                <img src="tiny-12.png" class="tattoo-design" alt="Design">
                <img src="tiny-13.png" class="tattoo-design" alt="Design">
                <img src="tiny-14.png" class="tattoo-design" alt="Design">
                <img src="tiny-15.png" class="tattoo-design" alt="Design">
                <img src="tiny-16.png" class="tattoo-design" alt="Design">
                <img src="tiny-17.png" class="tattoo-design" alt="Design">
            </div>
        </div>

    </div>
<div class="return-menu-container">
        <a href="menu.html">
            <img src="return-menu.png" class="return-menu-btn" alt="Return to Menu">
        </a>
    </div>
    <!-- The Lightbox (Zoomed Image Pop-up) -->
    <div id="lightbox">
        <span class="close-btn" id="close-lightbox">&times;</span>
        <span class="nav-btn prev-btn" id="prev-btn">&#10094;</span> <!-- Left Arrow -->
        <img id="lightbox-img" src="" alt="Zoomed Design">
        <span class="nav-btn next-btn" id="next-btn">&#10095;</span> <!-- Right Arrow -->
    </div>

    <script>
        // --- ADVANCED LIGHTBOX LOGIC ---
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-lightbox');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        
        const allDesigns = document.querySelectorAll('.tattoo-design');
        
        let currentCategoryArray = [];
        let currentIndex = 0;

        // 1. Click on a design to open it
        allDesigns.forEach(design => {
            design.addEventListener('click', function() {
                // Find all images within the exact same grid column as the clicked image
                const parentGrid = this.closest('.design-grid');
                currentCategoryArray = Array.from(parentGrid.querySelectorAll('.tattoo-design'));
                
                // Find what number image we clicked in that specific category
                currentIndex = currentCategoryArray.indexOf(this);
                
                updateLightboxImage();
                lightbox.classList.add('active'); 
            });
        });

        // 2. Function to update the picture source
        function updateLightboxImage() {
            lightboxImg.src = currentCategoryArray[currentIndex].src;
        }

        // 3. Next Image Function (Loops to start if at the end)
        function showNext() {
            if(currentCategoryArray.length === 0) return;
            currentIndex = (currentIndex + 1) % currentCategoryArray.length;
            updateLightboxImage();
        }

        // 4. Previous Image Function (Loops to end if at the start)
        function showPrev() {
            if(currentCategoryArray.length === 0) return;
            currentIndex = (currentIndex - 1 + currentCategoryArray.length) % currentCategoryArray.length;
            updateLightboxImage();
        }

        // 5. Button Listeners for Arrows
        nextBtn.addEventListener('click', showNext);
        prevBtn.addEventListener('click', showPrev);

        // 6. Keyboard Listeners (Left/Right Arrows and Escape to close)
        document.addEventListener('keydown', function(event) {
            if (!lightbox.classList.contains('active')) return;
            if (event.key === 'ArrowRight') showNext();
            if (event.key === 'ArrowLeft') showPrev();
            if (event.key === 'Escape') lightbox.classList.remove('active');
        });

        // 7. Mobile Touch/Swipe Detection
        let touchStartX = 0;
        let touchEndX = 0;

        lightbox.addEventListener('touchstart', function(event) {
            touchStartX = event.changedTouches[0].screenX;
        }, false);

        lightbox.addEventListener('touchend', function(event) {
            touchEndX = event.changedTouches[0].screenX;
            handleSwipe();
        }, false);

        function handleSwipe() {
            // Swiped left (go to next image)
            if (touchEndX < touchStartX - 50) showNext();
            // Swiped right (go to previous image)
            if (touchEndX > touchStartX + 50) showPrev();
        }

        // 8. Close the lightbox
        closeBtn.addEventListener('click', function() {
            lightbox.classList.remove('active');
        });

        // Close if they click the white background (but NOT if they click the arrows or image)
        lightbox.addEventListener('click', function(event) {
            if (event.target === lightbox) {
                lightbox.classList.remove('active');
            }
        });

        // --- BACK BUTTON FIX ---
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                window.location.reload(); 
            }
        });
    </script>
</body>
</html>
