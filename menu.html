<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ezel Inks - Menu</title>
    <style>
        /* Base page styling */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000000;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* White screen overlay for a smooth transition */
        #white-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #ffffff;
            opacity: 0; 
            pointer-events: none;
            z-index: 50; 
            transition: opacity 1.5s ease-in-out;
        }

        /* The container holding all 3 options perfectly centered */
        .menu-container {
            display: flex;
            flex-direction: row;
            gap: 80px; 
            align-items: flex-end; 
            z-index: 10;
        }

        /* Individual button containers */
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s ease-in-out;
            position: relative;
        }

        .text-img {
            width: 160px; 
            margin-bottom: 25px; 
            transition: opacity 0.5s ease-in-out;
        }

        /* NEW: A wrapper to handle the zoom click without breaking the continuous spin */
        .star-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 1.8s ease-in-out;
            z-index: 10;
        }

        /* NEW: Constant slow rotation for the stars */
        .star-img {
            width: 120px; 
            animation: spin 12s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- ANIMATION STATES (Triggered on click) --- */
        
        /* 1. Dissolve whatever is NOT clicked */
        body.animating .menu-item:not(.selected) {
            opacity: 0;
            pointer-events: none;
        }

        /* 2. Bring the CLICKED item to the front and hide its text */
        body.animating .menu-item.selected {
            z-index: 100;
        }
        body.animating .menu-item.selected .text-img {
            opacity: 0;
        }

        /* 3. Scale up the wrapper of the CLICKED star massively */
        body.animating .menu-item.selected .star-wrapper {
            transform: scale(80) rotate(180deg);
        }

        /* 4. Fade the whole screen to white */
        body.animating #white-overlay {
            opacity: 1;
        }

        /* --- MOBILE VIEW --- */
        @media (max-width: 768px) {
            /* Stacks the 3 options vertically on phones */
            .menu-container {
                flex-direction: column;
                gap: 50px; 
                align-items: center; 
            }
            
            /* Shrinks elements slightly to fit the screen nicely */
            .text-img {
                width: 140px; 
                margin-bottom: 15px;
            }
            .star-img {
                width: 100px;
            }
        }
    </style>
</head>
<body>

    <!-- The white overlay that fades in -->
    <div id="white-overlay"></div>

    <div class="menu-container">
        
        <!-- OPTION 1: Available Designs -->
        <div class="menu-item" data-target="designs.html">
            <img src="text-designs.png" class="text-img" alt="Available Designs">
            <div class="star-wrapper">
                <img src="star-designs.png" class="star-img" alt="Star">
            </div>
        </div>

        <!-- OPTION 2: Pricing -->
        <div class="menu-item" data-target="pricing.html">
            <img src="text-pricing.png" class="text-img" alt="Pricing">
            <div class="star-wrapper">
                <img src="star-pricing.png" class="star-img" alt="Star">
            </div>
        </div>

        <!-- OPTION 3: Custom Design -->
        <div class="menu-item" data-target="custom.html">
            <img src="text-custom.png" class="text-img" alt="Custom Design">
            <div class="star-wrapper">
                <img src="star-custom.png" class="star-img" alt="Star">
            </div>
        </div>

    </div>

    <script>
        const menuItems = document.querySelectorAll('.menu-item');

        menuItems.forEach(item => {
            item.addEventListener('click', function() {
                const targetPage = this.getAttribute('data-target');
                
                // Marks this item as clicked
                this.classList.add('selected');
                // Triggers the animations
                document.body.classList.add('animating');
                
                setTimeout(function() {
                    window.location.href = targetPage;
                }, 1800);
            });
        });
    </script>
</body>
</html>
